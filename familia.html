<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e3a39">
<title>Minha Família</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous">
<style>
  :root{--bg:#0e1512;--panel:#15201c;--line:#26332e;--txt:#eef4f1;--mut:#92a39c;--accent:#2f9e6f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);
       display:flex;flex-direction:column;overscroll-behavior:none}
  header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;
         align-items:center;justify-content:space-between}
  header h1{font-size:16px;font-weight:800}
  header .c{font-size:12px;color:var(--mut)}
  #members{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);
           overflow-x:auto;scrollbar-width:none}
  #members::-webkit-scrollbar{display:none}
  .mcard{flex:0 0 auto;min-width:150px;background:#0e1512;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .mcard .top{display:flex;align-items:center;gap:8px}
  .mcard .ava{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
              font-size:12px;font-weight:800;color:#06130d}
  .mcard .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
  .mcard .meta{font-size:11px;color:var(--mut);margin-top:4px}
  .mcard button{margin-top:8px;width:100%;border:none;border-radius:8px;background:#1d3b31;color:#dff3ea;
                font-family:inherit;font-size:11.5px;font-weight:700;padding:7px}
  .mcard button:active{background:#255043}
  #map{flex:1;background:#0b0d10;min-height:200px}
  #empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);
         font-size:13px;padding:30px;line-height:1.6}
  .leaflet-container{background:#0b0d10}
  .lbl{background:#11211a;border:1px solid #2f9e6f;color:#eafff5;border-radius:10px;padding:2px 7px;
       font-size:11px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .leaflet-tooltip-top.lbl::before{border-top-color:#2f9e6f}
</style>
</head>
<body>
<header>
  <h1>Minha Família</h1>
  <span class="c" id="count">—</span>
</header>
<div id="members"></div>
<div id="map"></div>
<div id="empty" style="display:none">Nenhum familiar apareceu ainda.<br>Instale o app <b>Multimix Rastreio</b>, faça login com um nome e inicie o rastreio.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
<script>
const q = new URLSearchParams(location.search);
const ACCOUNT = q.get('account') || 'familia';
const COLORS = ['#2f9e6f','#3a7afe','#e0893a','#c0557a','#8a6fd6','#d1c04b','#49b3c4'];

let map=null, mapOk=false;
const layers = {}; // id -> { marker, trail, color }

function initMap(){
  if (typeof L === 'undefined') throw new Error('leaflet');
  map = L.map('map',{zoomControl:true}).setView([-15.78,-47.92],4);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    { maxZoom:19, attribution:'Tiles © Esri' }).addTo(map);
  mapOk = true;
}

function haversine(a,b){
  const R=6371000,toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]),dLng=toR(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function dejitter(fixes){
  const pts=[];
  for(const f of fixes){
    if(typeof f.lat!=='number'||typeof f.lng!=='number')continue;
    const p=[f.lat,f.lng];
    if(!pts.length){pts.push(p);continue;}
    if(haversine(pts[pts.length-1],p)>=Math.max(25,f.acc||0))pts.push(p);
  }
  return pts;
}
function ago(iso){
  const s=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/1000));
  if(s<60)return 'há '+s+'s'; if(s<3600)return 'há '+Math.round(s/60)+' min'; return 'há '+Math.round(s/3600)+' h';
}

async function locate(id, btn){
  const old = btn.textContent; btn.textContent='Solicitando…';
  try{ await fetch('/api/v1/locate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:id})}); }catch(_){}
  setTimeout(()=>{ btn.textContent=old; }, 6000);
}

async function poll(){
  try{
    const r = await fetch('/api/v1/members?account='+encodeURIComponent(ACCOUNT),{cache:'no-store'});
    const d = await r.json();
    render(d.members||[]);
  }catch(e){ document.getElementById('count').textContent='sem conexão'; }
  setTimeout(poll, 7000);
}

function render(list){
  document.getElementById('count').textContent = list.length ? (list.length+' no mapa') : '0';
  document.getElementById('empty').style.display = list.length ? 'none' : 'flex';
  document.getElementById('map').style.display = list.length ? 'block' : 'none';

  const box = document.getElementById('members'); box.innerHTML='';
  const bounds = [];
  list.forEach((m, i) => {
    const color = COLORS[i % COLORS.length];
    const ini = (m.name||'?').trim().charAt(0).toUpperCase();
    const last = m.last;
    // card
    const el = document.createElement('div'); el.className='mcard';
    el.innerHTML = '<div class="top"><span class="ava" style="background:'+color+'">'+ini+'</span>'
      + '<span class="nm">'+(m.name||m.id)+'</span></div>'
      + '<div class="meta">'+(last ? (ago(last.ts)+' · '+(last.battery!=null?last.battery+'%':'n/d')) : 'sem posição')+'</div>'
      + '<button>Localizar agora</button>';
    el.querySelector('button').onclick = (ev) => locate(m.id, ev.target);
    box.appendChild(el);

    // mapa
    if(mapOk && last && typeof last.lat==='number'){
      const latlng=[last.lat,last.lng]; bounds.push(latlng);
      const pts = dejitter(m.fixes||[]);
      if(!layers[m.id]){
        layers[m.id] = {
          marker: L.circleMarker(latlng,{radius:9,color:'#fff',weight:3,fillColor:color,fillOpacity:1}).addTo(map)
                    .bindTooltip(m.name||m.id,{permanent:true,direction:'top',className:'lbl',offset:[0,-6]}),
          trail: L.polyline(pts,{color:color,weight:4,opacity:.75}).addTo(map)
        };
      } else {
        layers[m.id].marker.setLatLng(latlng).setTooltipContent(m.name||m.id);
        layers[m.id].trail.setLatLngs(pts);
      }
    }
  });
  if(mapOk && bounds.length && !window._centered){
    try{ map.fitBounds(bounds,{padding:[50,50],maxZoom:16}); window._centered=true; }catch(_){}
  }
}

try{ initMap(); }catch(e){ /* mapa opcional */ }
poll();
</script>
</body>
</html>

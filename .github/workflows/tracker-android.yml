name: Build Tracker APK

on:
  push:
    branches: [ main ]
    paths: [ 'tracker/**', '.github/workflows/tracker-android.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JS deps
        working-directory: tracker
        run: npm ci
      - name: Bundle web
        working-directory: tracker
        run: npm run bundle
      - name: Capacitor sync
        working-directory: tracker
        run: npx cap sync android
      - name: Assinatura fixa (se o segredo DEBUG_KEYSTORE_B64 existir)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Assinatura fixa aplicada (atualiza por cima do app anterior)."
          else
            echo "Sem DEBUG_KEYSTORE_B64: assinatura muda a cada build (precisa desinstalar para atualizar)."
          fi
      - name: Build debug APK
        working-directory: tracker/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Nome proprio para o download (multimix.apk)
        run: cp tracker/android/app/build/outputs/apk/debug/app-debug.apk tracker/android/app/build/outputs/apk/debug/multimix.apk
      - name: Publicar APK como Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tracker-latest
          name: Multimix Rastreio (debug)
          prerelease: true
          files: tracker/android/app/build/outputs/apk/debug/*.apk

name: Build Tracker APK

on:
  push:
    branches: [ main ]
    paths: [ 'tracker/**', '.github/workflows/tracker-android.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JS deps
        working-directory: tracker
        run: npm ci
      - name: Bundle web
        working-directory: tracker
        run: npm run bundle
      - name: Capacitor sync
        working-directory: tracker
        run: npx cap sync android
      - name: Build debug APK
        working-directory: tracker/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar APK como Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tracker-latest
          name: Multimix Rastreio (debug)
          prerelease: true
          files: tracker/android/app/build/outputs/apk/debug/*.apk

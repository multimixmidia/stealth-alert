name: Build Android APK

on:
  push:
    branches: [ main ]
    paths: [ 'app/**', '.github/workflows/android.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS deps
        working-directory: app
        run: npm ci

      - name: Capacitor sync
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: originali-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk

      - name: Publicar APK como Release (link direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Originali (debug)
          prerelease: true
          files: app/android/app/build/outputs/apk/debug/*.apk

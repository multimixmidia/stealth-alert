<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111418">
<title>Acompanhar localização</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous">
<style>
  :root{--bg:#111418;--panel:#191d23;--line:#2a2f37;--txt:#f1f3f5;--mut:#9aa2ad;
        --alert:#d13b3b;--safe:#1f9d57;--accent:#3a7afe}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);
       display:flex;flex-direction:column;overscroll-behavior:none}
  #banner{padding:12px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px}
  #banner.alert{background:var(--alert);color:#fff}
  #banner.safe{background:var(--safe);color:#fff}
  #banner.wait{background:#333a43;color:#fff}
  #banner .pulse{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  #stats{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);
         overflow-x:auto;scrollbar-width:none}
  #stats::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:#0e1115;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .chip .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .chip .v{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap}
  #map{flex:1;background:#0b0d10;min-height:180px}
  #fallback{flex:1;display:none;align-items:center;justify-content:center;text-align:center;
            color:var(--mut);font-size:13px;padding:24px;line-height:1.5}
  #bar{display:flex;gap:10px;padding:12px;background:var(--panel);border-top:1px solid var(--line)}
  #bar a,#bar button{flex:1;text-align:center;text-decoration:none;border:none;border-radius:11px;
       padding:13px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  #bar .maps{background:var(--accent);color:#fff}
  #bar .center{background:#23262c;color:var(--txt)}
  .leaflet-container{background:#0b0d10}
</style>
</head>
<body>

<div id="banner" class="wait"><span class="pulse"></span><span id="bannerTxt">Conectando…</span></div>
<div id="stats">
  <div class="chip"><div class="k">Atualizado</div><div class="v" id="sUpd">—</div></div>
  <div class="chip"><div class="k">Situação</div><div class="v" id="sMove">—</div></div>
  <div class="chip"><div class="k">Bateria</div><div class="v" id="sBat">—</div></div>
  <div class="chip"><div class="k">Precisão</div><div class="v" id="sAcc">—</div></div>
  <div class="chip"><div class="k">Coordenadas</div><div class="v" id="sCoord">—</div></div>
</div>
<div id="map"></div>
<div id="fallback">Carregando mapa… se não aparecer, use <b style="color:#fff">&nbsp;Abrir no Google Maps</b>&nbsp;abaixo. Os dados acima continuam atualizando.</div>
<div id="bar">
  <a class="maps" id="mapsLink" href="#" target="_blank" rel="noopener">Abrir no Google Maps</a>
  <button class="center" onclick="recenter()">Centralizar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
<script>
const q = new URLSearchParams(location.search);
const ID = q.get('id') || 'DEV-ANDROID-0001';
const K  = q.get('k') || '';
const URLT = '/api/v1/track?id=' + encodeURIComponent(ID) + (K ? '&k=' + encodeURIComponent(K) : '');

let map=null, marker=null, trail=null, lastLatLng=null, autoCenter=true, mapOk=false;

function initMap(){
  if (typeof L === 'undefined') throw new Error('leaflet ausente');
  map = L.map('map', { zoomControl:true }).setView([-15.78,-47.92], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
  map.on('dragstart', () => autoCenter=false);
  trail = L.polyline([], { color:'#3a7afe', weight:4, opacity:.8 }).addTo(map);
  mapOk = true;
}
function recenter(){ autoCenter=true; if(mapOk && lastLatLng) map.setView(lastLatLng, 16); }

function fmtAgo(iso){
  const s = Math.max(0, Math.round((Date.now()-new Date(iso).getTime())/1000));
  if (s<60) return 'há ' + s + 's';
  if (s<3600) return 'há ' + Math.round(s/60) + ' min';
  return 'há ' + Math.round(s/3600) + ' h';
}
function haversine(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]), dLng=toR(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function setBanner(cls, txt){
  const b=document.getElementById('banner');
  b.className=cls; document.getElementById('bannerTxt').textContent=txt;
}

async function poll(){
  try{
    const r = await fetch(URLT, { cache:'no-store' });
    if(!r.ok) throw new Error('http '+r.status);
    render(await r.json());
  }catch(e){
    setBanner('wait','Sem conexão com o servidor…');
  }
  setTimeout(poll, 7000);
}

function render(d){
  const valid = (d.fixes||[]).filter(f => typeof f.lat==='number' && typeof f.lng==='number');
  const last = d.fixes && d.fixes.length ? d.fixes[d.fixes.length-1] : null;

  if(!last){ setBanner('wait','Aguardando primeira localização…'); }
  else if(d.state==='SAFE'){ setBanner('safe','Desarmado pelo dono — situação normalizada'); }
  else { setBanner('alert','ALERTA ATIVO — rastreando'); }

  document.getElementById('sUpd').textContent  = last ? fmtAgo(last.ts) : '—';
  document.getElementById('sBat').textContent  = last && last.battery!=null ? last.battery+'%' : 'n/d';
  document.getElementById('sAcc').textContent  = last && last.acc!=null ? '±'+last.acc+' m' : 'n/d';

  const pts = valid.map(f => [f.lat, f.lng]);
  if(pts.length){
    const latlng = pts[pts.length-1];
    lastLatLng = latlng;
    document.getElementById('sCoord').textContent = latlng[0].toFixed(5)+', '+latlng[1].toFixed(5);
    document.getElementById('mapsLink').href = 'https://www.google.com/maps?q=' + latlng[0] + ',' + latlng[1];

    let mv='Parado';
    if(pts.length>=2) mv = haversine(pts[pts.length-2], pts[pts.length-1])>35 ? 'Em movimento' : 'Parado';
    document.getElementById('sMove').textContent = mv;

    if(mapOk){
      trail.setLatLngs(pts);
      if(!marker) marker = L.circleMarker(latlng, { radius:9, color:'#fff', weight:3, fillColor:'#d13b3b', fillOpacity:1 }).addTo(map);
      else marker.setLatLng(latlng);
      if(autoCenter) map.setView(latlng, Math.max(map.getZoom(),16));
    }
  } else {
    document.getElementById('sMove').textContent = last ? 'Sem GPS' : '—';
    document.getElementById('sCoord').textContent = last ? 'sem GPS' : '—';
  }
}

// Mapa é opcional: se falhar, mostramos os dados mesmo assim e seguimos buscando.
try { initMap(); }
catch(e){ document.getElementById('map').style.display='none'; document.getElementById('fallback').style.display='flex'; }
if(!mapOk){ document.getElementById('map').style.display='none'; document.getElementById('fallback').style.display='flex'; }
poll();
</script>
</body>
</html>
